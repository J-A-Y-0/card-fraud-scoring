[project]
name = "fraudscore"
version = "0.1.0"
description = "Card fraud scoring with out-of-time validation and card-stop value estimation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.7",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
fraudscore = "fraudscore.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# numpy linked against Apple Accelerate raises spurious "encountered in matmul" warnings
# on finite inputs (verified: results are finite and correct); they are not model issues.
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
