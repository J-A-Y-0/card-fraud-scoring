name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Unit tests
        run: uv run pytest -q
      - name: End-to-end smoke run on synthetic data
        env:
          FRAUD_DATA_DIR: data/synthetic
          FRAUD_ARTIFACTS_DIR: artifacts/synthetic
        run: |
          uv run fraudscore synth
          uv run fraudscore all --quick
